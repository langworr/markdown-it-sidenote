<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Plugin Demonstration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" media="screen" href="main.css" />
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@12/dist/markdown-it.min.js"></script>
    <script src="../dist/markdown-it-sidenote.js"></script>
  </head>
  <body>
    <div class="main">
      <div class="header">
        <h1>markdown-it-sidenote</h1>
      </div>
      <div class="content">
        <p>
          This is a minimalist demonstration of the
          <a href="https://github.com/langworr/markdown-it-sidenote">
            markdown-it-sidenote
          </a>
          plugin.
        </p>
        <p>
          Simply write in the text box below, then click away, and the text will be
          rendered.
        </p>
        <textarea id="inputtext" class="inputtext">
# Title

Try to write sentences with some keywords in square bracket, e.g. symmetry[_1] or contrast[_2].

This is a [_3] second paragraph.

[_1]: This is the first sidenote for **symmetry**.

[_2]: This is the second sidenote for **contrast**.

[_3]: definition of the third sidenote.

You can also write the sidenote definition anywhere in the text, for example at the end of the document, or like an inline note right after the reference _[This is the third note for *reference*].

</textarea>
        <div id="renderer" class="rendered"></div>
      </div>
    </div>
    <noscript>You need to enable JavaScript to run this app! </noscript>
    <script>
      // get elements
      var inputText = document.getElementById("inputtext")
      var renderer = document.getElementById("renderer")

      // setup change handler
      inputText.oninput = handleChange
      function handleChange(e) {
        const text = window
          .markdownit({ html: true })
          .use(window.markdownitSidenote)
          .render(e.target.value)
        renderer.innerHTML = text
      }

      // trigger first render
      inputText.dispatchEvent(new Event("input"))
    </script>
  </body>
</html>
