<!DOCTYPE html>
<html>

    <title>Plugin Demonstration</title>

    <link rel="stylesheet" type="text/css" media="screen" href="main.css" />

    <style>
    .sidenote {
    float: right;
    clear: right;
    width: 25%;
    margin: 0 0 0.5rem 1rem;
    box-sizing: border-box;
    background: #f9f9fb;
    border-left: 3px solid #c8c8d0;

    color: #333;
  }
</style>

  <body>

      <div class="content">
        <p>
          This is a minimalist demonstration of the
          <a href="https://github.com/langworr/markdown-it-sidenote">
            markdown-it-sidenote
          </a>
          plugin.
        </p>
        <p>
          Simply write in the text box below, then click away, and the text will be
          rendered.
        </p>

        <textarea id="inputtext" class="inputtext">
this is a paragraph with[$1] inline references[$1] and some cookies[$2]

this is another paragraph$[paragraph is an old red wine]

[$1]: ciccio

[$2]: pluto pippo e **paperino**


</textarea>
        <div id="renderer" class="rendered"></div>
      </div>
    </div>
    <noscript>You need to enable JavaScript to run this app! </noscript>
    <script>
      // get elements
      var inputText = document.getElementById("inputtext")
      var renderer = document.getElementById("renderer")

      // setup change handler
      inputText.oninput = handleChange
      function handleChange(e) {
        const text = window
          .markdownit({ html: true })
          .use(window.markdownitSidenote)
          .render(e.target.value)
        renderer.innerHTML = text
      }

      // trigger first render
      inputText.dispatchEvent(new Event("input"))
        const sidenotes = renderer.querySelectorAll(".sidenote")
  sidenotes.forEach(note => {
    const id = note.id
    const ref = renderer.querySelector(`sup[id="${id}"]`)
    if (ref) {
      ref.insertAdjacentElement("afterend", note)
    }
  })
    </script>
